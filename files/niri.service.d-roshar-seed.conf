[Unit]
# Drop-in on top of niri's own packaged niri.service (never edit that file
# directly — it's package-owned and this survives niri updates cleanly).
# Forces roshar-seed-niri-config.service to run to completion first — see
# that unit's own comment for exactly why the ordering matters here.
Requires=roshar-seed-niri-config.service
After=roshar-seed-niri-config.service
