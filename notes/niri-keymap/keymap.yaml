draw_config:
  key_w: 74
  key_h: 74
  dark_mode: auto
  footer_text: "Roshar / niri — Mod+letter/,/./ default keybindings, from files/skel-niri/dms/binds.kdl (DankMaterialShell's vendored defaults). Blank = unbound. Mod = Super on a native niri session (which is how Roshar runs it), so Super+X here is the same key as every other Mod-prefixed bind. Personal tweaks go in ~/.config/niri/local.kdl and aren't shown here — this is only the out-of-the-box default."
  svg_extra_style: |
    text.label { font-size: 15px !important; }
    text.tl { font-size: 16px !important; font-weight: 700 !important; }
    text.footer { fill: #6b7280 !important; }
